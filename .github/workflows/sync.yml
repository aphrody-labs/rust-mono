name: sync

# Merges upstream into every fork (merge-upstream API), moves the gitlinks of this repository to the forks' new heads,
# appends the ledger and pushes the result to main. The forks have Actions disabled, so the sync runs here, with an
# installation token of the organization's GitHub App (client id in the org variable APHRODY_APP_CLIENT_ID, key in the org
# secret APHRODY_APP_KEY, which must list this repository).
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Write: merge the forks, bump the pins, commit and push. Off is a dry run."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Token for the forks and this repository
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APHRODY_APP_CLIENT_ID }}
          private-key: ${{ secrets.APHRODY_APP_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
          submodules: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Test the tools
        run: bun test tools

      - name: Sync
        id: sync
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          git config user.name "${GITHUB_REPOSITORY_OWNER} sync"
          git config user.email "${GITHUB_REPOSITORY_OWNER}-sync@users.noreply.github.com"
          if [ "$APPLY" = "true" ]; then
            bun tools/sync.ts --apply --commit
          else
            bun tools/sync.ts
          fi

      - name: Push
        if: always() && steps.sync.outcome != 'skipped' && (github.event_name == 'schedule' || inputs.apply)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then
            echo "nothing to push"
            exit 0
          fi
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          header="http.https://github.com/.extraheader=AUTHORIZATION: basic $auth"
          git -c "$header" fetch --depth=50 origin main
          git rebase origin/main
          git -c "$header" push origin HEAD:main
